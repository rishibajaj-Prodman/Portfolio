<html><head><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;font-family:var(--font-sans);width:700px;height:130px;box-sizing:border-box;padding:16px;background:var(--background);display:flex;align-items:center"><div style="display:flex;gap:8px;width:100%;height:100px">

<div style="flex:1;background:var(--sand-50);border:var(--rule);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted-foreground)">sand-50 (raised)</div>
<div style="flex:1;background:var(--surface-muted);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted-foreground)">sand-200 (band)</div>

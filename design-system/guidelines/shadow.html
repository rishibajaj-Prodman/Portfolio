<!-- @dsCard group="Brand" viewport="700x150" name="Elevation" subtitle="Flat by default — hairline rules carry structure; shadows only for floating surfaces" -->
<html><head><link rel="stylesheet" href="../styles.css"></head><body style="margin:0;font-family:var(--font-sans);width:700px;height:140px;box-sizing:border-box;padding:16px;background:var(--background);display:flex;align-items:center"><div style="display:flex;flex-direction:column;gap:10px;width:100%">
<div style="display:flex;gap:20px;align-items:center">
<div style="width:150px;height:64px;background:var(--card);border:var(--rule);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted-foreground)">card · rule, no shadow</div>
<div style="width:150px;height:64px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted-foreground)">overlay</div>
<div style="width:150px;height:64px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-modal);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted-foreground)">modal</div>
</div>
<div style="font-size:11px;color:var(--muted-foreground)">The template's four-step shadow ramp on resting cards is gone. Elevation now signals "floats above the page", nothing else.</div>
</div></body></html>
